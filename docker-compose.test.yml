# Docker Compose configuration for running E2E tests
# This provides an isolated environment with a dedicated test database
#
# Usage:
#   docker-compose -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from test-runner
#
# Or use the npm script:
#   npm run test:e2e:docker

services:
  # Test database - isolated from development database
  postgres-test:
    image: postgres:16-alpine
    container_name: ceitba-postgres-test
    environment:
      POSTGRES_DB: ceitba_test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5434:5432"  # Different port to avoid conflicts
    networks:
      - ceitba-test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d ceitba_test_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      # Use tmpfs for faster test database (data stored in memory)
      - /var/lib/postgresql/data

  # Test runner - runs e2e tests
  test-runner:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: test
    container_name: ceitba-test-runner
    environment:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://test_user:test_password@postgres-test:5432/ceitba_test_db
      DATABASE_URL: postgresql://test_user:test_password@postgres-test:5432/ceitba_test_db
      # Mock tokens for testing
      ITBA_API_TOKEN: test_token
      ITBA_API_BASE_URL: https://test.example.com
      ITBA_API_TIMEOUT: 30000
      SUPABASE_ACCESS_TOKEN: test_supabase_token
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - ceitba-test-network
    command: >
      sh -c "
        echo '✨ Waiting for database to be ready...' &&
        npx prisma migrate deploy &&
        echo '🚀 Running E2E tests...' &&
        npm run test:e2e
      "

networks:
  ceitba-test-network:
    driver: bridge
